<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wave Incremental 图标候选</title>
<link rel="icon" href="wave-icon-v1.svg" type="image/svg+xml">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 40px; background: #1a1a1a; color: #ddd; font: 16px system-ui, sans-serif; }
  h1 { font-size: 24px; font-weight: 500; }
  p { color: #a0a0a0; }
  .panel { display: flex; align-items: center; gap: 36px; padding: 32px; margin-top: 24px; border-radius: 18px; background: #242424; }
  .light { background: #f4f4f4; color: #333; }
  figure { margin: 0; text-align: center; }
  img { display: block; margin: 0 auto 14px; }
  figcaption { font-size: 13px; opacity: .7; }
  @media (max-width: 650px) { body { padding: 20px; } .panel { gap: 24px; flex-wrap: wrap; } }
</style>
<h1>Wave Incremental</h1>
<p>单条波形 · 深灰与青色 · 浏览器标签图标</p>
<div class="panel">
  <figure><img src="wave-icon-v1.svg" width="128" height="128" alt="波形图标"><figcaption>128px</figcaption></figure>
  <figure><img src="wave-icon-48.png" width="48" height="48" alt=""><figcaption>48px</figcaption></figure>
  <figure><img src="wave-icon-32.png" width="32" height="32" alt=""><figcaption>32px</figcaption></figure>
  <figure><img src="wave-icon-16.png" width="16" height="16" alt=""><figcaption>16px</figcaption></figure>
</div>
<div class="panel light">
  <figure><img src="wave-icon-v1.svg" width="128" height="128" alt=""><figcaption>128px</figcaption></figure>
  <figure><img src="wave-icon-48.png" width="48" height="48" alt=""><figcaption>48px</figcaption></figure>
  <figure><img src="wave-icon-32.png" width="32" height="32" alt=""><figcaption>32px</figcaption></figure>
  <figure><img src="wave-icon-16.png" width="16" height="16" alt=""><figcaption>16px</figcaption></figure>
</div>
</html>
