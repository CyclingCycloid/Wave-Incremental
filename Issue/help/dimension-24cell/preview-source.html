<div id="higher-dimensional-folding" aria-label="二十四胞体动画预览">
  <section data-variant="二十四胞体" aria-label="二十四胞体投影">
    <div class="poly-sample">
      <div class="poly-title">维度折叠器</div>
      <canvas data-geometry="cell24" role="img" aria-label="二十四胞体的旋转线框投影，橙色前景与灰色后景呈现内部的多面体结构">二十四胞体投影动画</canvas>
      <div class="poly-footer"><span>四维 · 24 顶点 · 96 条边</span><button type="button" class="poly-pause cursor-interaction" aria-pressed="false">暂停动画</button></div>
    </div>
  </section>
</div>
<style>
  #higher-dimensional-folding {
    --poly-bg: light-dark(#f7f7f7, #111113);
    --poly-text: light-dark(#252525, #d8d8d8);
    --poly-muted: light-dark(#676767, #9b9b9b);
    --poly-line: light-dark(#c36814, #ff8c1a);
    --poly-bright: light-dark(#d97c22, #ffb347);
    --poly-rear: light-dark(#858585, #727277);
    --poly-edge: light-dark(#dadada, #343438);
    --poly-button: light-dark(#ededed, #242426);
    --poly-hover: light-dark(#e4e4e4, #303034);
  }
  #higher-dimensional-folding .poly-sample {
    box-sizing: border-box;
    width: 100%;
    height: 364px;
    padding: 16px 18px 12px;
    overflow: hidden;
    border: 1px solid var(--poly-edge);
    border-radius: 6px;
    background: var(--poly-bg);
    color: var(--poly-text);
    font: 14px "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  #higher-dimensional-folding .poly-title { text-align: center; font-size: 16px; font-weight: 500; color: var(--poly-line); }
  #higher-dimensional-folding canvas { display: block; width: 100%; height: 280px; touch-action: pan-y; }
  #higher-dimensional-folding .poly-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--poly-muted); font-size: 12px; }
  #higher-dimensional-folding .poly-pause { flex-shrink: 0; padding: 5px 9px; border: 1px solid var(--poly-edge); border-radius: 4px; background: var(--poly-button); color: var(--poly-text); font: inherit; }
  #higher-dimensional-folding .poly-pause:hover { background: var(--poly-hover); }
  @media (max-width: 420px) { #higher-dimensional-folding .poly-sample { padding-inline: 10px; } }
  @media (pointer: coarse) { #higher-dimensional-folding .poly-pause { min-height: 44px; } }
</style>
<script>
(() => {
  const root = document.getElementById('higher-dimensional-folding');
  if (!root) return;
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const appearance = matchMedia('(prefers-color-scheme: dark)');
  const probe = document.createElement('span');
  probe.setAttribute('aria-hidden', 'true');
  probe.style.display = 'none';
  root.querySelector('.poly-sample').appendChild(probe);
  let colors;
  function updateColors() {
    const resolve = token => { probe.style.color = 'var(' + token + ')'; return getComputedStyle(probe).color; };
    colors = { line: resolve('--poly-line'), bright: resolve('--poly-bright'), rear: resolve('--poly-rear') };
  }
  updateColors();
  function cell24() {
    const vertices = [], edges = [];
    for (let a = 0; a < 4; a++) {
      for (let b = a + 1; b < 4; b++) {
        for (const sa of [-1, 1]) for (const sb of [-1, 1]) {
          const p = [0, 0, 0, 0];
          p[a] = sa / Math.sqrt(2); p[b] = sb / Math.sqrt(2);
          vertices.push(p);
        }
      }
    }
    for (let a = 0; a < vertices.length; a++) {
      for (let b = a + 1; b < vertices.length; b++) {
        const distanceSquared = vertices[a].reduce((sum, coordinate, axis) => sum + (coordinate - vertices[b][axis]) ** 2, 0);
        if (Math.abs(distanceSquared - 1) < 1e-8) edges.push([a, b]);
      }
    }
    return {dimension: 4, vertices, edges};
  }
  const models = {cell24: cell24()};
  const cached = window.openai?.widgetState?.privateContent?.polyAnimations;
  const starts = {cell24: 2.3};
  const views = Array.from(root.querySelectorAll('section[data-variant]')).map(section => {
    const canvas = section.querySelector('canvas'), button = section.querySelector('button');
    const kind = canvas.dataset.geometry;
    const state = {speed: 0.65, size: 1, playing: !reducedMotion.matches};
    const previous = cached?.[kind];
    if (previous) {
      if (Number.isFinite(previous.speed)) state.speed = Math.max(0.2, Math.min(1.2, previous.speed));
      if (Number.isFinite(previous.size)) state.size = Math.max(0.8, Math.min(1.1, previous.size));
      if (typeof previous.playing === 'boolean') state.playing = previous.playing && !reducedMotion.matches;
    }
    const view = {section, canvas, button, kind, state, context: canvas.getContext('2d'), time: starts[kind], width: 0, height: 0};
    button.addEventListener('click', () => {
      state.playing = !state.playing;
      draw(view); save(); schedule();
    });
    return view;
  });
  function save() {
    if (!window.openai?.setWidgetState) return;
    const privateContent = {polyAnimations: Object.fromEntries(views.map(view => [view.kind, {...view.state}]))};
    const result = window.openai.setWidgetState({privateContent});
    if (result?.catch) result.catch(() => {});
  }
  function resize(view) {
    const box = view.canvas.getBoundingClientRect();
    if (!box.width || !box.height) return false;
    const ratio = Math.min(devicePixelRatio || 1, 1.5);
    if (view.width !== box.width || view.height !== box.height || view.ratio !== ratio) {
      view.width = box.width; view.height = box.height; view.ratio = ratio;
      view.canvas.width = Math.round(box.width * ratio); view.canvas.height = Math.round(box.height * ratio);
      view.context.setTransform(ratio, 0, 0, ratio, 0, 0);
    }
    return true;
  }
  function projectedVertices(view) {
    const model = models[view.kind], time = view.time;
    const planes = [[0, 3, time * 0.29], [1, 2, time * 0.13 + 0.12]];
    const rotations = planes.map(([a, b, angle]) => [a, b, Math.sin(angle), Math.cos(angle)]);
    const sx = Math.sin(-0.28), cx = Math.cos(-0.28), sy = Math.sin(0.38), cy = Math.cos(0.38);
    const scale = Math.min(view.width * 0.31, view.height * 0.33) * view.state.size;
    return model.vertices.map(vertex => {
      const p = [...vertex];
      for (const [a, b, sine, cosine] of rotations) {
        const u = p[a], v = p[b];
        p[a] = u * cosine - v * sine; p[b] = u * sine + v * cosine;
      }
      for (let dimension = model.dimension; dimension > 3; dimension--) {
        const ratio = 2.8 / (2.8 - p[dimension - 1]);
        for (let axis = 0; axis < dimension - 1; axis++) p[axis] *= ratio;
      }
      const y = p[1] * cx - p[2] * sx, z = p[1] * sx + p[2] * cx;
      const x2 = p[0] * cy + z * sy, z2 = -p[0] * sy + z * cy;
      const perspective = 4 / (4 - z2);
      return [view.width / 2 + x2 * scale * perspective, view.height / 2 + y * scale * perspective, z2];
    });
  }
  function draw(view) {
    if (!resize(view)) return;
    const ctx = view.context, model = models[view.kind], points = projectedVertices(view);
    ctx.clearRect(0, 0, view.width, view.height);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const edges = model.edges.map(edge => ({a: points[edge[0]], b: points[edge[1]], depth: (points[edge[0]][2] + points[edge[1]][2]) / 2})).sort((a, b) => a.depth - b.depth);
    for (const edge of edges) {
      const foreground = edge.depth > 0;
      ctx.strokeStyle = foreground ? colors.line : colors.rear;
      ctx.globalAlpha = foreground ? 0.56 + 0.35 * Math.min(1, edge.depth) : 0.17 + 0.17 * Math.max(0, 1 + edge.depth);
      ctx.lineWidth = foreground ? 1.15 : 0.85;
      ctx.beginPath(); ctx.moveTo(edge.a[0], edge.a[1]); ctx.lineTo(edge.b[0], edge.b[1]); ctx.stroke();
    }
    for (const p of points) {
      ctx.fillStyle = p[2] > 0 ? colors.bright : colors.rear;
      ctx.globalAlpha = p[2] > 0 ? 0.90 : 0.28;
      ctx.beginPath(); ctx.arc(p[0], p[1], 1.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    view.button.textContent = view.state.playing ? '暂停动画' : '播放动画';
    view.button.setAttribute('aria-pressed', String(!view.state.playing));
  }
  let frameId = 0, previousFrame = 0, visible = true;
  const active = () => views.find(view => !view.section.hidden);
  function schedule() {
    if (!frameId && root.isConnected && visible && !document.hidden && active()?.state.playing) frameId = requestAnimationFrame(frame);
  }
  function frame(timestamp) {
    frameId = 0;
    const view = active();
    if (!root.isConnected || !visible || document.hidden || !view?.state.playing) { previousFrame = 0; return; }
    const elapsed = previousFrame ? timestamp - previousFrame : 34;
    if (elapsed >= 1000 / 30) {
      view.time += Math.min(elapsed / 1000, 0.10) * view.state.speed;
      previousFrame = timestamp; draw(view);
    }
    schedule();
  }
  const resizeObserver = new ResizeObserver(() => { const view = active(); if (view) draw(view); });
  views.forEach(view => resizeObserver.observe(view.canvas));
  const variantObserver = new MutationObserver(() => { previousFrame = 0; const view = active(); if (view) draw(view); schedule(); });
  views.forEach(view => variantObserver.observe(view.section, {attributes: true, attributeFilter: ['hidden']}));
  const intersectionObserver = new IntersectionObserver(entries => {
    visible = entries[0]?.isIntersecting ?? true;
    if (!visible && frameId) { cancelAnimationFrame(frameId); frameId = 0; }
    previousFrame = 0; schedule();
  });
  intersectionObserver.observe(views[0].canvas);
  function recolor() { updateColors(); const view = active(); if (view) draw(view); }
  appearance.addEventListener('change', recolor);
  const themeObserver = new MutationObserver(recolor);
  themeObserver.observe(document.documentElement, {attributes: true, attributeFilter: ['style', 'class', 'data-theme']});
  if (document.body) themeObserver.observe(document.body, {attributes: true, attributeFilter: ['style', 'class', 'data-theme']});
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && frameId) { cancelAnimationFrame(frameId); frameId = 0; }
    previousFrame = 0; schedule();
  });
  reducedMotion.addEventListener('change', () => {
    if (reducedMotion.matches) views.forEach(view => { view.state.playing = false; });
    const view = active(); if (view) draw(view);
  });
  window.addEventListener('openai:set_globals', event => {
    const next = event.detail?.globals?.widgetState?.privateContent?.polyAnimations;
    if (!next) return;
    for (const view of views) {
      const value = next[view.kind]; if (!value) continue;
      if (Number.isFinite(value.speed)) view.state.speed = Math.max(0.2, Math.min(1.2, value.speed));
      if (Number.isFinite(value.size)) view.state.size = Math.max(0.8, Math.min(1.1, value.size));
      if (typeof value.playing === 'boolean') view.state.playing = value.playing && !reducedMotion.matches;
    }
    const view = active(); if (view) draw(view); schedule();
  });
  if (globalThis.Tweak) {
    views.forEach(view => {
      const tweak = new Tweak({container: view.canvas, onChange: () => { draw(view); schedule(); }});
      tweak.addSlider(view.state, 'speed', {label: '动画速度', min: 0.2, max: 1.2, step: 0.1});
      tweak.addSlider(view.state, 'size', {label: '图形大小', min: 0.8, max: 1.1, step: 0.05});
    });
  }
  const first = active(); if (first) draw(first);
  schedule();
})();
</script>
